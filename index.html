<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhabindra Pokharel | झविन्द्र पोखरेल</title>
    <!-- Google Fonts for Clean Modern Nepali Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --sky-50: #f0f9ff;
            --sky-100: #e0f2fe;
            --sky-200: #bae6fd;
            --sky-300: #7dd3fc;
            --sky-400: #38bdf8;
            --sky-500: #0ea5e9;
            --sky-600: #0284c7;
            --sky-700: #0369a1;
            --sky-800: #075985;
            --sky-900: #0c4a6e;
            --sky-950: #082f49;
            --text-dark: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --gold-50: #fffbeb;
            --gold-100: #fef3c7;
            --gold-600: #d97706;
            --gold-700: #b45309;
            --gold-800: #92400e;
            --border-light: rgba(186, 230, 253, 0.6);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(2, 132, 199, 0.08), 0 2px 4px -2px rgba(2, 132, 199, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(2, 132, 199, 0.1), 0 4px 6px -4px rgba(2, 132, 199, 0.08);
            --shadow-xl: 0 20px 25px -5px rgba(2, 132, 199, 0.12), 0 8px 10px -6px rgba(2, 132, 199, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--sky-50);
            color: var(--text-body);
            font-family: 'Mukta', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        .top-bar {
            background: linear-gradient(90deg, var(--sky-900) 0%, var(--sky-800) 100%);
            color: #f8fafc;
            padding: 0.5rem 1.5rem;
            font-size: 0.88rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .live-capsules {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .capsule {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 0.22rem 0.75rem;
            border-radius: 20px;
            font-size: 0.84rem;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .capsule strong {
            color: var(--sky-200);
            font-weight: 600;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--sky-100);
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.04);
        }

        nav {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.5rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--sky-900);
            line-height: 1.2;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 0.4rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.94rem;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--sky-700);
            background: var(--sky-100);
        }

        .nav-cta {
            background: var(--sky-600) !important;
            color: white !important;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sky-700);
            background: var(--sky-100);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--sky-950);
            margin-bottom: 0.4rem;
        }

        .section-subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.6rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
        }

        .card-category-badge {
            display: inline-block;
            background: var(--sky-100);
            color: var(--sky-700);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
        }

        .card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--sky-900);
            margin-bottom: 0.8rem;
        }

        .disease-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .disease-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .disease-name {
            font-weight: 700;
            color: #b91c1c;
            font-size: 0.98rem;
            margin-bottom: 0.2rem;
        }

        .disease-text {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }

        .market-card {
            background: #fff;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 1rem;
            box-shadow: var(--shadow-md);
        }
